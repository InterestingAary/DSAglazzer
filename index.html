    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // One-time cleanup: unregister stale service workers and drop old
      // CacheStorage entries left by earlier PWA deploys. Those were serving
      // the old app shell on first load (new UI only appeared after a hard
      // refresh). This project currently ships no service worker, so anything
      // registered under this origin is stale. Gated by a version flag so it
      // runs once per visitor instead of on every load.
      (function () {
        try {
          var FLAG = 'dsa-glazzer-sw-cleanup-v1';
          if (window.localStorage && localStorage.getItem(FLAG) === 'done') return;
          function markDone() {
            try { localStorage.setItem(FLAG, 'done'); } catch (e) {}
          }
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) {
                  return r.unregister().catch(function () {});
                }));
              }).catch(function () {})
            );
          }
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  return caches.delete(k).catch(function () {});
                }));
              }).catch(function () {})
            );
          }
          Promise.all(jobs).then(markDone).catch(markDone);
        } catch (e) {}
      })();
    </script>
  </body>
</html>
